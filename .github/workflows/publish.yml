name: publish
# After a pull request is merged: every new package version becomes a GitHub release
# <id>@<version> with its .zip, and index.json (read by the engine and the website) is rewritten.
on:
  push:
    branches: [main]
    paths-ignore: [index.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Release new versions and rewrite index.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/catalog.py publish
      - name: Commit index.json
        run: |
          if [ -z "$(git status --porcelain -- index.json)" ]; then echo "index.json unchanged"; exit 0; fi
          git config user.name "aiverse-catalog"
          git config user.email "actions@users.noreply.github.com"
          git add index.json
          git commit -m "index: publish new package versions"
          git push
